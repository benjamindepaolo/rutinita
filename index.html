<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<script>try{var f=JSON.parse(localStorage.getItem('forma-state-v2')),t=f&&f.settings&&f.settings.theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Registro de entrenamiento, rutinas y récords personales. Funciona sin conexión.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Forma — entrenamiento</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true">F</span><span>FORMA</span></div>
    <button class="icon-btn" data-a="settings" aria-label="Ajustes y copia de seguridad">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="update-bar" id="update-bar" hidden>
    <span>Hay una versión nueva de la app.</span>
    <button class="btn sm primary" id="update-btn">Actualizar</button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<div class="rest-bar" id="rest-bar" hidden>
  <div class="rest-fill" id="rest-fill"></div>
  <div class="rest-inner">
    <span class="rest-label">Descanso</span>
    <strong class="rest-time" id="rest-time">0:00</strong>
    <button class="btn sm" data-a="rest-minus" aria-label="Restar 15 segundos">−15</button>
    <button class="btn sm" data-a="rest-plus" aria-label="Sumar 15 segundos">+15</button>
    <button class="btn sm ghost" data-a="rest-skip">Saltar</button>
  </div>
</div>

<nav class="bottom-nav" aria-label="Secciones">
  <div class="nav-inner">
    <button class="nav-btn" data-a="tab" data-v="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</button>
    <button class="nav-btn" data-a="tab" data-v="calendario"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
    <button class="nav-btn" data-a="tab" data-v="rutinas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Rutinas</button>
    <button class="nav-btn" data-a="tab" data-v="progreso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l5-5 4 4 6-7"/></svg>Progreso</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<noscript><p style="padding:24px">Forma necesita JavaScript activado.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
